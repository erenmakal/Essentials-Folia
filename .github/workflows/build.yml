name: Build EssentialsX Folia

on:
  push:
    branches:
      - folia-patches
  pull_request:
    branches:
      - folia-patches
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Folia 26.2
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[ci-skip]')

    steps:
      - name: Checkout repository and EssentialsX submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions"

      - name: Apply Folia patches
        run: |
          chmod +x gradlew
          ./gradlew applyPatches --stacktrace

      - name: Verify Folia home/back fix was applied
        run: |
          grep -q "teleportOnEntityThread" Essentials-Patched/Essentials/src/main/java/com/earth2me/essentials/AsyncTeleport.java

      - name: Build EssentialsX Folia
        run: ./gradlew -p Essentials-Patched build --stacktrace -x test -x checkstyleMain

      - name: Archive plugin jars
        uses: actions/upload-artifact@v7
        with:
          name: EssentialsX-Folia-26.2
          path: Essentials-Patched/jars/*.jar
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: folia-26.2-build-${{ github.run_number }}
          name: EssentialsX Folia 26.2 - Build ${{ github.run_number }}
          body: |
            Automated Folia 26.2 build from `${{ github.sha }}`.

            Includes the Folia-safe `/home` and `/back` teleport fixes.
          artifacts: Essentials-Patched/jars/*.jar
          generateReleaseNotes: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: false
